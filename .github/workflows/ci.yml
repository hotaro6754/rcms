name: CI

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for an isolated CI database; nothing here is a real credential.
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rcms_dev
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rcms_test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rcms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production dependency audit (report only)
        run: npm audit --omit=dev || true
      # Some pages are prerendered from the database at build time.
      - name: Prepare the build database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE rcms_dev"
          npx prisma migrate deploy
      - run: npm run build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rcms_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run dev:accounts
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3000/sign-in && exit 0; sleep 2; done
          cat dev.log; exit 1
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-and-server-logs
          path: |
            dev.log
            /tmp/rcms-playwright
          retention-days: 7
