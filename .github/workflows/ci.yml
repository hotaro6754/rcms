name: CI

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for an isolated CI database; nothing here is a real credential.
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  # MariaDB, as on Hostinger's web hosting.
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/rcms_dev
  TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/rcms_test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit and integration tests, build
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install browsers on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rcms_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production dependency audit (report only)
        run: npm audit --omit=dev || true
      # Some pages are prerendered from the database at build time.
      - name: Prepare the build database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE rcms_dev CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          npm run db:deploy
      - run: npm run build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rcms_dev
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run dev:accounts
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3000/sign-in && exit 0; sleep 2; done
          cat dev.log; exit 1
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-and-server-logs
          path: |
            dev.log
            /tmp/rcms-playwright
          retention-days: 7
